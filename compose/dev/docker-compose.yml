name: ${COMPOSE_PROJECT_NAME:-template-web-app-dev}

x-node-service: &node-service
  image: template-web-app-dev:local
  pull_policy: never
  working_dir: /workspace
  init: true
  restart: unless-stopped
  volumes:
    - ../..:/workspace
    - node_modules:/workspace/node_modules
    - npm_cache:/root/.npm
  networks:
    - application

services:
  dependencies:
    <<: *node-service
    build:
      context: ../..
      dockerfile: compose/dev/Dockerfile
    command: npm ci --include=dev
    restart: "no"
    environment:
      NODE_ENV: development
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application

  database:
    <<: *node-service
    command: npm run db:setup:dev
    restart: "no"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  application:
    <<: *node-service
    command: npm run dev
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 1001
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-template-web-app-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-template-web-app-web}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_HOST: 0.0.0.0
      VITE_PORT: 1002
      VITE_API_URL: http://localhost:${API_EXTERNAL_PORT}
      VITE_USE_POLLING: "true"
      VITE_WATCH_INTERVAL: "300"
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT}:1001"
      - "127.0.0.1:${WEB_EXTERNAL_PORT}:1002"
    depends_on:
      database:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:1001/health'), fetch('http://127.0.0.1:1002')]).then((responses) => { if (responses.some((response) => !response.ok)) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  node_modules:
  npm_cache:
  postgres_data:

networks:
  application:
    driver: bridge
